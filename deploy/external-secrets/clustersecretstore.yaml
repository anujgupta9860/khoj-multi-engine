# External Secrets Operator -> Google Secret Manager (project-wide store).
# Prereq: ESO installed (helm chart external-secrets/external-secrets) and
# its service account bound via Workload Identity to a Google service
# account with roles/secretmanager.secretAccessor on the secrets below.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcpsm
spec:
  provider:
    gcpsm:
      projectID: innovation-lab-2026
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: khoj
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
