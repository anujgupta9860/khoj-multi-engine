{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openrag-frontend
  annotations:
    kubernetes.io/ingress.class: gce
    {{- if .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName }}
    {{- end }}
spec:
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: openrag-frontend
                port:
                  number: 3000
    {{- end }}
    # Hostless catch-all: keeps the bare LB IP (and any other hostname)
    # working alongside the named host above.
    - http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: openrag-frontend
                port:
                  number: 3000
{{- end }}
