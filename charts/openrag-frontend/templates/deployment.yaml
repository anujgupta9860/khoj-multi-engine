apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: openrag-frontend }
  template:
    metadata:
      labels: { app: openrag-frontend }
    spec:
      # Stop k8s service-link env injection: a Service named
      # "openrag-backend" would otherwise inject
      # OPENRAG_BACKEND_PORT=tcp://<ip>:8000 into this pod (seen live -
      # the proxy built http://localhost:tcp://... URLs and failed).
      enableServiceLinks: false
      containers:
        - name: frontend
          image: {{ .Values.image }}
          ports: [{ containerPort: 3000 }]
          env:
            # The frontend proxy reads these three - NOT BACKEND_URL
            # (found live on first GKE install).
            - { name: OPENRAG_BACKEND_HOST, value: {{ .Values.backendHost }} }
            - { name: OPENRAG_BACKEND_PORT, value: {{ .Values.backendPort | quote }} }
            {{- if .Values.backendSsl }}
            - { name: OPENRAG_BACKEND_SSL, value: {{ .Values.backendSsl | quote }} }
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
