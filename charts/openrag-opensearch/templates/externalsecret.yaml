apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: opensearch-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      remoteRef: { key: openrag-opensearch-admin-password }
