apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langflow-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: langflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: LANGFLOW_SUPERUSER_PASSWORD
      remoteRef: { key: openrag-langflow-superuser-password }
    # The ingestion/chat flows execute INSIDE Langflow and read these
    # from env-sourced global variables (upstream compose parity).
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef: { key: openrag-opensearch-admin-password }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: openrag-openai-api-key }
