apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-backend
spec:
  replicas: 1
  # The data PVC is ReadWriteOnce: with the default RollingUpdate the new
  # pod can never attach the volume while the old pod holds it, and the
  # rollout deadlocks. Recreate terminates the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: openrag-backend }
  template:
    metadata:
      labels: { app: openrag-backend }
    spec:
      # Stop k8s service-link env injection: a Service named "opensearch"
      # would otherwise inject OPENSEARCH_PORT=tcp://<ip>:9200 into this
      # pod and shadow the real port (same collision class as Langflow's).
      enableServiceLinks: false
      containers:
        - name: backend
          image: {{ .Values.image }}
          ports: [{ containerPort: 8000 }]
          env:
            - { name: LLM_PROVIDER, value: {{ .Values.llm.provider }} }
            - { name: LLM_MODEL, value: {{ .Values.llm.model }} }
            - { name: EMBEDDING_PROVIDER, value: {{ .Values.llm.embeddingProvider }} }
            - { name: EMBEDDING_MODEL, value: {{ .Values.llm.embeddingModel }} }
            - { name: OPENSEARCH_URL, value: {{ .Values.opensearchUrl }} }
            # The backend actually dials OPENSEARCH_HOST/OPENSEARCH_PORT
            # (defaults localhost when unset - found live on first GKE
            # install: backend sat in its ping loop despite a healthy
            # OpenSearch, because OPENSEARCH_URL alone is ignored).
            - { name: OPENSEARCH_HOST, value: {{ .Values.opensearchHost }} }
            - { name: OPENSEARCH_PORT, value: {{ .Values.opensearchPort | quote }} }
            - { name: LANGFLOW_URL, value: {{ .Values.langflowUrl }} }
            # settings.py skips Langflow API-key generation unless the
            # superuser NAME is present (the password arrives via the
            # synced secret) - without it onboarding dies with
            # "No Langflow API key available" (found live, Nov 3 2026).
            - { name: LANGFLOW_SUPERUSER, value: {{ .Values.langflowSuperuser }} }
            - { name: DOCLING_SERVE_URL, value: {{ .Values.doclingUrl }} }
            - { name: LANGFLOW_ALLOW_CUSTOM_COMPONENTS, value: "true" }
            # Single-node OpenSearch expectations (learned on the VM deploy)
            - { name: OPENSEARCH_EXPECTED_DATA_NODE_COUNT, value: "1" }
            - { name: OPENSEARCH_EXPECTED_CLUSTER_MANAGER_COUNT, value: "1" }
            - { name: OPENSEARCH_EXPECTED_COORDINATING_NODE_COUNT, value: "0" }
            - { name: OPENSEARCH_NODE_COUNT_CHECK_ENABLED, value: "false" }
          envFrom:
            - secretRef: { name: openrag-backend-secrets }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - { name: documents, mountPath: {{ .Values.persistence.mountPath }} }
            {{- range .Values.stateMounts }}
            - { name: {{ .name }}, mountPath: {{ .mountPath }} }
            {{- end }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: documents
          persistentVolumeClaim: { claimName: openrag-documents }
        {{- range .Values.stateMounts }}
        - name: {{ .name }}
          persistentVolumeClaim: { claimName: {{ .claimName }} }
        {{- end }}
      {{- end }}
