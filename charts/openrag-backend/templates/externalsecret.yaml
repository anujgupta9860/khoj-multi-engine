# Credentials come from Google Secret Manager via External Secrets
# Operator - never from values. See deploy/external-secrets/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrag-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: openrag-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: openrag-openai-api-key }
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef: { key: openrag-opensearch-admin-password }
    - secretKey: LANGFLOW_SUPERUSER_PASSWORD
      remoteRef: { key: openrag-langflow-superuser-password }
    - secretKey: SESSION_SECRET
      remoteRef: { key: openrag-session-secret }
