# Patched backend image built by cloudbuild.yaml from
# deploy/docker/Dockerfile.backend (tags: SHORT_SHA + latest).
image: us-central1-docker.pkg.dev/innovation-lab-2026/khoj/openrag-backend:latest
opensearchUrl: https://opensearch:9200
opensearchHost: opensearch
opensearchPort: "9200"
langflowUrl: http://langflow:7860
langflowSuperuser: langflow
doclingUrl: http://docling:5001
llm:
  provider: openai
  model: gpt-4o-mini
  embeddingProvider: openai
  embeddingModel: text-embedding-3-small
# No secrets in values: credentials sync from Google Secret Manager via
# External Secrets Operator (templates/externalsecret.yaml).
persistence:
  enabled: true
  size: 10Gi
  mountPath: /app/openrag-documents
# Upstream compose bind-mounts FIVE backend state dirs; the chart
# originally persisted only openrag-documents. With /app/keys and
# /app/config ephemeral, every pod restart regenerated the JWT signing
# keys and forgot the synced Langflow flow IDs - presenting live as
# OpenSearch 401s on search and "Flow identifier ... not found" on
# ingestion (Nov 3 2026). Persist them like upstream does.
# (/app/flows is deliberately NOT mounted: an empty PVC would shadow
# the flow JSONs bundled in the image.)
stateMounts:
  - { name: keys, claimName: openrag-keys, mountPath: /app/keys, size: 1Gi }
  - { name: config, claimName: openrag-config, mountPath: /app/config, size: 1Gi }
  - { name: data, claimName: openrag-data, mountPath: /app/data, size: 5Gi }
resources:
  requests: { cpu: "500m", memory: "1Gi" }
  limits: { cpu: "2", memory: "4Gi" }
