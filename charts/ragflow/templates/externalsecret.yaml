{{- if .Values.secrets.externalSecret.enabled }}
# Engine passwords come from Google Secret Manager via External
# Secrets Operator - never from values. Created at deploy time
# (docs/deploy-multi-engine.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.secretName }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_PASSWORD
      remoteRef: { key: {{ .Values.secrets.externalSecret.gsmKeys.mysqlPassword }} }
    - secretKey: ELASTIC_PASSWORD
      remoteRef: { key: {{ .Values.secrets.externalSecret.gsmKeys.elasticPassword }} }
    - secretKey: MINIO_PASSWORD
      remoteRef: { key: {{ .Values.secrets.externalSecret.gsmKeys.minioPassword }} }
{{- end }}
