apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragflow-minio-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.minio.pvcSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragflow-minio
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ragflow-minio }
  template:
    metadata:
      labels: { app: ragflow-minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.user }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: MINIO_PASSWORD
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ragflow-minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: ragflow-minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragflow-kvrocks-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.kvrocks.pvcSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragflow-kvrocks
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ragflow-kvrocks }
  template:
    metadata:
      labels: { app: ragflow-kvrocks }
    spec:
      containers:
        - name: kvrocks
          # Root, like upstream's compose (user: "0"): kvrocks opens
          # its log file inside the data dir at startup and crashes
          # (spdlog file_helper::open) when the PVC is root-owned
          # but the process is not - seen live 2026-11-06.
          securityContext:
            runAsUser: 0
          image: {{ .Values.kvrocks.image }}
          # The stock image config listens on 6666; RAGFlow expects
          # the Redis port. Upstream renders a config file for this;
          # the equivalent CLI overrides are bind/port/dir.
          args: ["--bind", "0.0.0.0", "--port", "6379", "--dir", "/data"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ragflow-kvrocks-data }
---
apiVersion: v1
kind: Service
metadata:
  name: kvrocks
spec:
  selector: { app: ragflow-kvrocks }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragflow-nats
spec:
  replicas: 1
  selector:
    matchLabels: { app: ragflow-nats }
  template:
    metadata:
      labels: { app: ragflow-nats }
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["--jetstream"]
          ports: [{ containerPort: 4222 }]
          readinessProbe:
            tcpSocket: { port: 4222 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: ragflow-nats }
  ports: [{ port: 4222, targetPort: 4222 }]
