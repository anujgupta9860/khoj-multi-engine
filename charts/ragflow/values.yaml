# RAGFlow engine stack. Passwords never live here: one ExternalSecret
# syncs them from Google Secret Manager into the `ragflow-secrets`
# Secret (keys created at deploy time - see
# docs/deploy-multi-engine.md).

image:
  repository: infiniflow/ragflow
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

# Doc engine: elasticsearch (RAGFlow's default) or infinity (their
# single-container engine - lighter, slightly different retrieval
# characteristics). DEPLOYED AS infinity: on GKE Autopilot the ES
# pod is rejected by the Warden admission webhook (vm.max_map_count
# is not in Autopilot's allowed sysctls - verified live 2026-11-06),
# so elasticsearch only works on clusters that allow the sysctl.
# The Khoj comparison must note this stack runs Infinity.
docEngine: infinity

mysql:
  image: mysql:8.0.40
  database: rag_flow
  pvcSize: 5Gi
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "2Gi" }

elasticsearch:
  image: elasticsearch:8.11.3
  pvcSize: 10Gi
  javaOpts: "-Xms1g -Xmx1g"
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits: { cpu: "2", memory: "4Gi" }

infinity:
  image: infiniflow/infinity:v0.7.5-x64-v3
  pvcSize: 10Gi
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }

minio:
  # pgsty/silo is the maintained MinIO fork RAGFlow's own compose
  # switched to - minio/minio no longer exists on Docker Hub
  # (verified 2026-11-06: repository returns 404).
  image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
  user: rag_flow
  pvcSize: 10Gi
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }

kvrocks:
  image: apache/kvrocks:2.16.0
  pvcSize: 2Gi

redis:
  # KvRocks password shared by the ragflow server (REDIS_PASSWORD)
  # and kvrocks itself (requirepass). This is RAGFlow's own
  # published default - its service_conf template renders
  # ${REDIS_PASSWORD:-infini_rag_flow} - and kvrocks is reachable
  # only inside the namespace. Live finding 2026-11-06: with no
  # requirepass set, every ragflow server dies with "Client sent
  # AUTH, but no password is set".
  password: "infini_rag_flow"

nats:
  image: nats:2

server:
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "8Gi" }
  # The RAGFlow web UI (bundled nginx on port 80) gets its own
  # ingress only when enabled - the Khoj web app is the product UI;
  # this exists for API-key/LLM admin during setup.
  ingress:
    enabled: false
    host: ""

secrets:
  secretName: ragflow-secrets
  externalSecret:
    enabled: true
    refreshInterval: 1h
    gsmKeys:
      mysqlPassword: ragflow-mysql-password
      elasticPassword: ragflow-elastic-password
      minioPassword: ragflow-minio-password
