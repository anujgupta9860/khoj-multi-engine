{{- if .Values.jira.externalSecret.enabled }}
# The Jira API token comes from Google Secret Manager via External
# Secrets Operator - never from values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.jira.secretName }}
spec:
  refreshInterval: {{ .Values.jira.externalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.jira.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: JIRA_API_TOKEN
      remoteRef: { key: {{ .Values.jira.externalSecret.gsmKey }} }
{{- end }}
{{- if .Values.auth.externalSecret.enabled }}
---
# The auth signing secret (KHOJ_AUTH_SECRET) comes from Google Secret
# Manager via External Secrets Operator - never from values. The agent
# chart syncs the same GSM key into its own secret so both services
# verify the same tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.secretName }}
spec:
  refreshInterval: {{ .Values.auth.externalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: KHOJ_AUTH_SECRET
      remoteRef: { key: {{ .Values.auth.externalSecret.gsmKey }} }
{{- end }}
{{- if and .Values.engine.ragflowExternalSecret.enabled (eq .Values.engine.name "ragflow") }}
---
# The RAGFlow API key is generated inside RAGFlow after its deploy,
# stored in Google Secret Manager, and synced here via ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.engine.ragflowSecretName }}
spec:
  refreshInterval: {{ .Values.engine.ragflowExternalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.engine.ragflowSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: RAGFLOW_API_KEY
      remoteRef: { key: {{ .Values.engine.ragflowExternalSecret.gsmKey }} }
{{- end }}
{{- if and .Values.engine.nvidiaExternalSecret.enabled (eq .Values.engine.name "nemo") }}
---
# The NVIDIA API key (build.nvidia.com) lives in Google Secret
# Manager and is synced here via ESO - never in values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.engine.nvidiaSecretName }}
spec:
  refreshInterval: {{ .Values.engine.nvidiaExternalSecret.refreshInterval }}
  secretStoreRef:
    name: gcpsm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.engine.nvidiaSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: NVIDIA_API_KEY
      remoteRef: { key: {{ .Values.engine.nvidiaExternalSecret.gsmKey }} }
{{- end }}
