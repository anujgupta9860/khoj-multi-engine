# Khoj.ai CI/CD: build images -> push to Artifact Registry -> helm upgrade
# on the GKE Autopilot cluster. Trigger: push to main (Cloud Build GitHub
# trigger, see docs/deploy-ci.md). The Cloud Build service account needs
# roles/artifactregistry.writer + roles/container.developer on the project.
#
# NOTE: images are pushed explicitly inside the build steps. Do NOT rely on
# the top-level `images:` field alone: those pushes happen only when the
# whole build succeeds, but the helm step below waits for pods that need
# the images - a deadlock that broke deploy #2 (helm timed out waiting on
# an ImagePullBackOff pod whose tag was never pushed).
substitutions:
  _REGION: us-central1
  _CLUSTER: khoj
  _REPO: us-central1-docker.pkg.dev/innovation-lab-2026/khoj

steps:
  # 1. Build + push the Khoj web service image.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >
        docker build -t $_REPO/khoj:$SHORT_SHA -t $_REPO/khoj:latest .
        && docker push $_REPO/khoj:$SHORT_SHA
        && docker push $_REPO/khoj:latest

  # 2. Build + push the patched OpenRAG backend image (agent.py include
  #    fix applied at build time - see deploy/docker/Dockerfile.backend).
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >
        docker build -f deploy/docker/Dockerfile.backend
        -t $_REPO/openrag-backend:$SHORT_SHA -t $_REPO/openrag-backend:latest .
        && docker push $_REPO/openrag-backend:$SHORT_SHA
        && docker push $_REPO/openrag-backend:latest

  # 2b. Build + push the A2A chat agent image (build context is the repo
  #     root - the agent reuses app/orgs.py).
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >
        docker build -f agent/Dockerfile
        -t $_REPO/khoj-agent:$SHORT_SHA -t $_REPO/khoj-agent:latest .
        && docker push $_REPO/khoj-agent:$SHORT_SHA
        && docker push $_REPO/khoj-agent:latest

  # 3. Write a static-token kubeconfig into the shared workspace. (The
  #    kubeconfig from `gcloud get-credentials` shells out to the
  #    gke-gcloud-auth-plugin binary, which the helm builder image does
  #    not have - that broke deploy #1. A bearer-token kubeconfig works
  #    in any image; the token only needs to outlive the build.)
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        EP=$$(gcloud container clusters describe $_CLUSTER --region $_REGION --format='value(endpoint)')
        CA=$$(gcloud container clusters describe $_CLUSTER --region $_REGION --format='value(masterAuth.clusterCaCertificate)')
        TOK=$$(gcloud auth print-access-token)
        cat > /workspace/kubeconfig <<EOF
        apiVersion: v1
        kind: Config
        clusters:
        - cluster:
            server: https://$$EP
            certificate-authority-data: $$CA
          name: khoj
        contexts:
        - context: {cluster: khoj, user: cloudbuild}
          name: khoj
        current-context: khoj
        users:
        - name: cloudbuild
          user: {token: $$TOK}
        EOF
        echo "kubeconfig written for https://$$EP"

  # 4. Deploy the Khoj chart with the new image tag.
  - name: alpine/helm:3.16
    env: ["KUBECONFIG=/workspace/kubeconfig"]
    args: [upgrade, --install, khoj, ./charts/khoj,
           --set, "image.repository=$_REPO/khoj",
           --set, "image.tag=$SHORT_SHA",
           --set, "workloadIdentity.gsaEmail=khoj-app@innovation-lab-2026.iam.gserviceaccount.com",
           --wait, --timeout, 5m]

  # 5. Deploy the A2A chat agent chart.
  - name: alpine/helm:3.16
    env: ["KUBECONFIG=/workspace/kubeconfig"]
    args: [upgrade, --install, khoj-agent, ./charts/khoj-agent,
           --set, "image.repository=$_REPO/khoj-agent",
           --set, "image.tag=$SHORT_SHA",
           --wait, --timeout, 5m]

images:
  - "$_REPO/khoj:$SHORT_SHA"
  - "$_REPO/khoj:latest"
  - "$_REPO/khoj-agent:$SHORT_SHA"
  - "$_REPO/khoj-agent:latest"
  - "$_REPO/openrag-backend:$SHORT_SHA"
  - "$_REPO/openrag-backend:latest"

options:
  logging: GCS_ONLY
